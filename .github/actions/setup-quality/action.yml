name: Setup quality environment
description: Install the existing Node, pnpm and optional native prerequisites
inputs:
  native:
    description: Install and validate the desktop Linux build prerequisites
    default: "false"
runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      if: ${{ inputs.native == 'true' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libssl-dev \
          libgtk-3-dev

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Diagnose Linux build environment
      if: ${{ inputs.native == 'true' }}
      shell: bash
      run: apps/desktop/scripts/diagnose-linux.sh --strict
