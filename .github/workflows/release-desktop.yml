name: Verify v0.32.0 candidate assets

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify all candidate packages and checksums
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CANDIDATE_RUN: '44672820224'
      CANDIDATE_SHA: d7745358914141e698733369463c8c1f979c535c
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$CANDIDATE_SHA"
          test "$(gh run view "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ github.token }}
          pattern: agentkib-desktop-*
          path: candidate
      - name: Verify manifest and SHA-256 checksums
        run: python3 .github/scripts/verify-candidate-assets.py candidate
