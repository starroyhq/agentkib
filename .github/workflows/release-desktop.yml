name: Desktop Package Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and publish; leave empty for artifact-only builds"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate and test selected revision
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-preflight-ubuntu22-x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate desktop versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tauri_version=$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/src-tauri/tauri.conf.json')).version")
          package_version=$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/package.json')).version")
          cargo_version=$(cargo metadata --no-deps --format-version 1 | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const desktop = JSON.parse(input).packages.find(({ name }) => name === "agentkib-desktop");
              if (!desktop) process.exit(1);
              console.log(desktop.version);
            });
          ')

          if [[ ! "$tauri_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid desktop version: $tauri_version" >&2
            exit 1
          fi
          if [[ "$tauri_version" != "$package_version" || "$tauri_version" != "$cargo_version" ]]; then
            echo "Desktop versions differ: tauri=$tauri_version package=$package_version cargo=$cargo_version" >&2
            exit 1
          fi

          echo "Validated AgentKib desktop version $tauri_version"
          echo "app_version=$tauri_version" >> "$GITHUB_OUTPUT"

      - name: Validate release ref
        id: release
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          REQUESTED_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          release_tag="$PUSHED_TAG"
          if [[ -n "$REQUESTED_TAG" ]]; then
            if [[ -n "$release_tag" && "$release_tag" != "$REQUESTED_TAG" ]]; then
              echo "Selected ref tag $release_tag does not match requested tag $REQUESTED_TAG" >&2
              exit 1
            fi
            release_tag="$REQUESTED_TAG"
          fi

          release_sha=$(git rev-parse 'HEAD^{commit}')
          should_publish=false

          if [[ -n "$release_tag" ]]; then
            expected_tag="v$APP_VERSION"
            if [[ "$release_tag" != "$expected_tag" ]]; then
              echo "Release tag $release_tag does not match desktop version $APP_VERSION; expected $expected_tag" >&2
              exit 1
            fi

            tag_sha=$(git rev-list -n 1 "$release_tag")
            if [[ "$tag_sha" != "$release_sha" ]]; then
              echo "Release tag $release_tag resolves to $tag_sha, but checkout resolved to $release_sha" >&2
              exit 1
            fi

            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if ! git merge-base --is-ancestor "$release_sha" origin/main; then
              echo "Release commit $release_sha is not contained in origin/main" >&2
              exit 1
            fi

            should_publish=true
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "Selected release revision: sha=$release_sha tag=${release_tag:-none} publish=$should_publish"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test frontend
        run: pnpm test

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

  desktop:
    name: Build ${{ matrix.name }} ${{ matrix.arch }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            arch: arm64
            os: macos-15
            artifact: macos-arm64
            asset_suffix: macos-arm64
            bundles: app,dmg
          - name: macOS
            arch: x64
            os: macos-15-intel
            artifact: macos-x64
            asset_suffix: macos-x64
            bundles: app,dmg
          - name: Windows
            arch: x64
            os: windows-2025
            artifact: windows-x64
            asset_suffix: windows-x64
            bundles: nsis
          - name: Windows
            arch: arm64-preview
            os: windows-11-arm
            artifact: windows-arm64-preview
            asset_suffix: windows-arm64-preview
            bundles: nsis
          - name: Ubuntu
            arch: x64
            os: ubuntu-22.04
            artifact: linux-ubuntu-x64
            asset_suffix: linux-x64
            bundles: deb,appimage
          - name: Ubuntu
            arch: arm64-preview
            os: ubuntu-24.04-arm
            artifact: linux-ubuntu-arm64-preview
            asset_suffix: linux-arm64-preview
            bundles: deb,appimage

    env:
      APP_VERSION: ${{ needs.preflight.outputs.app_version }}
      CARGO_TERM_COLOR: always
      DESKTOP_RELEASE_DIR: dist/desktop-release

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources || true
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils curl file pkg-config patchelf libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libfuse2 libglib2.0-bin desktop-file-utils \
            xdg-utils dbus-x11 xvfb

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust and quota collector
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.artifact }}
          cache-directories: ~/.cache/agentkib/codexbar/0.49.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean previous bundle outputs
        shell: bash
        run: find target -type d -path '*/release/bundle' -prune -exec rm -rf '{}' + 2>/dev/null || true

      - name: Build Linux bundles
        if: runner.os == 'Linux'
        run: apps/desktop/scripts/build-linux-bundles.sh --bundles ${{ matrix.bundles }}

      - name: Build macOS or Windows bundles
        if: runner.os != 'Linux'
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Smoke test Linux bundles
        if: runner.os == 'Linux'
        run: .github/scripts/smoke-test-linux-package.sh target

      - name: Smoke test installed Ubuntu package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package=$(find "$PWD/target" -type f -name '*.deb' -path '*/bundle/deb/*' -print -quit)
          test -n "$package"
          sudo apt-get install -y "$package"
          .github/scripts/smoke-test-linux-installed.sh

      - name: Smoke test Windows x64 installer
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        run: ./.github/scripts/smoke-test-windows-installer.ps1 -SearchRoot target

      - name: Verify macOS application bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find target -type d -path '*/bundle/macos/*.app' -print -quit)
          test -n "$app"
          executable=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -u+x -print -quit)
          test -n "$executable"
          echo "Verified macOS application executable: $executable"

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DESKTOP_RELEASE_DIR"
          mkdir -p "$DESKTOP_RELEASE_DIR"
          prefix="AgentKib_${APP_VERSION}_${{ matrix.asset_suffix }}"

          if [[ "$RUNNER_OS" == macOS ]]; then
            app=$(find target -type d -path '*/bundle/macos/*.app' -print -quit)
            test -n "$app"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$DESKTOP_RELEASE_DIR/${prefix}.app.zip"
          fi

          while IFS= read -r artifact; do
            case "$artifact" in
              *.dmg) cp "$artifact" "$DESKTOP_RELEASE_DIR/${prefix}.dmg" ;;
              *.exe) cp "$artifact" "$DESKTOP_RELEASE_DIR/${prefix}.exe" ;;
              *.deb) cp "$artifact" "$DESKTOP_RELEASE_DIR/${prefix}.deb" ;;
              *.AppImage) cp "$artifact" "$DESKTOP_RELEASE_DIR/${prefix}.AppImage" ;;
            esac
          done < <(find target -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -path '*/bundle/*' | sort)

          count=$(find "$DESKTOP_RELEASE_DIR" -type f | wc -l | tr -d ' ')
          test "$count" -gt 0
          find "$DESKTOP_RELEASE_DIR" -type f -print

      - name: Write release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$DESKTOP_RELEASE_DIR"
          for artifact in *; do
            [[ "$artifact" == *.sha256 ]] && continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$artifact" > "$artifact.sha256"
            else
              shasum -a 256 "$artifact" > "$artifact.sha256"
            fi
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agentkib-desktop-${{ matrix.artifact }}
          path: ${{ env.DESKTOP_RELEASE_DIR }}/*
          if-no-files-found: error

  fedora-x64:
    name: Build Fedora x64 RPM
    needs: preflight
    runs-on: ubuntu-24.04
    container: fedora:42
    env:
      APP_VERSION: ${{ needs.preflight.outputs.app_version }}
      CARGO_TERM_COLOR: always
      DESKTOP_RELEASE_DIR: dist/desktop-release

    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf install -y \
            git curl tar gzip xz file findutils which binutils \
            gcc gcc-c++ make openssl-devel pkgconf-pkg-config patchelf \
            gtk3-devel webkit2gtk4.1-devel libappindicator-gtk3-devel \
            librsvg2-devel libxdo-devel rpm-build rpmdevtools cpio \
            desktop-file-utils xdg-utils dbus-daemon xorg-x11-server-Xvfb util-linux

      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust and quota collector
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-fedora-x64
          cache-directories: ~/.cache/agentkib/codexbar/0.49.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean previous bundle outputs
        shell: bash
        run: find target -type d -path '*/release/bundle' -prune -exec rm -rf '{}' + 2>/dev/null || true

      - name: Build RPM
        run: apps/desktop/scripts/build-linux-bundles.sh --bundles rpm

      - name: Smoke test RPM
        run: .github/scripts/smoke-test-linux-package.sh target rpm

      - name: Smoke test installed RPM
        shell: bash
        run: |
          set -euo pipefail
          package=$(find target -type f -name '*.rpm' -path '*/bundle/rpm/*' -print -quit)
          test -n "$package"
          dnf install -y "$package"
          .github/scripts/smoke-test-linux-installed.sh

      - name: Stage release artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DESKTOP_RELEASE_DIR"
          mkdir -p "$DESKTOP_RELEASE_DIR"
          source=$(find target -type f -name '*.rpm' -path '*/bundle/rpm/*' -print -quit)
          test -n "$source"
          destination="$DESKTOP_RELEASE_DIR/AgentKib_${APP_VERSION}_linux-x64.rpm"
          cp "$source" "$destination"
          (
            cd "$DESKTOP_RELEASE_DIR"
            artifact=$(basename "$destination")
            sha256sum "$artifact" > "$artifact.sha256"
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentkib-desktop-linux-fedora-x64
          path: ${{ env.DESKTOP_RELEASE_DIR }}/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - preflight
      - desktop
      - fedora-x64
    if: needs.preflight.outputs.should_publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.preflight.outputs.app_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ASSETS_DIR: dist/github-release
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      WORKFLOW_ARTIFACTS_DIR: dist/workflow-artifacts

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: agentkib-desktop-*
          path: ${{ env.WORKFLOW_ARTIFACTS_DIR }}

      - name: Validate release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          prefix="AgentKib_${APP_VERSION}"
          mkdir -p "$RELEASE_ASSETS_DIR"

          while IFS= read -r -d '' source; do
            destination="$RELEASE_ASSETS_DIR/$(basename "$source")"
            if [[ -e "$destination" ]]; then
              echo "Duplicate release artifact name: $(basename "$source")" >&2
              exit 1
            fi
            cp "$source" "$destination"
          done < <(find "$WORKFLOW_ARTIFACTS_DIR" -type f -print0)

          cat > "$RUNNER_TEMP/expected-release-assets.txt" <<EOF
          ${prefix}_linux-arm64-preview.AppImage
          ${prefix}_linux-arm64-preview.AppImage.sha256
          ${prefix}_linux-arm64-preview.deb
          ${prefix}_linux-arm64-preview.deb.sha256
          ${prefix}_linux-x64.AppImage
          ${prefix}_linux-x64.AppImage.sha256
          ${prefix}_linux-x64.deb
          ${prefix}_linux-x64.deb.sha256
          ${prefix}_linux-x64.rpm
          ${prefix}_linux-x64.rpm.sha256
          ${prefix}_macos-arm64.app.zip
          ${prefix}_macos-arm64.app.zip.sha256
          ${prefix}_macos-arm64.dmg
          ${prefix}_macos-arm64.dmg.sha256
          ${prefix}_macos-x64.app.zip
          ${prefix}_macos-x64.app.zip.sha256
          ${prefix}_macos-x64.dmg
          ${prefix}_macos-x64.dmg.sha256
          ${prefix}_windows-arm64-preview.exe
          ${prefix}_windows-arm64-preview.exe.sha256
          ${prefix}_windows-x64.exe
          ${prefix}_windows-x64.exe.sha256
          EOF

          find "$RELEASE_ASSETS_DIR" -maxdepth 1 -type f -exec basename {} \; \
            | LC_ALL=C sort > "$RUNNER_TEMP/actual-release-assets.txt"
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-release-assets.txt" \
            "$RUNNER_TEMP/expected-release-assets.txt"

          if ! diff -u "$RUNNER_TEMP/expected-release-assets.txt" \
            "$RUNNER_TEMP/actual-release-assets.txt"; then
            echo "Release artifact set does not match the expected manifest" >&2
            exit 1
          fi

          while IFS= read -r artifact; do
            test -s "$artifact"
          done < <(find "$RELEASE_ASSETS_DIR" -maxdepth 1 -type f | LC_ALL=C sort)

          while IFS= read -r checksum; do
            (
              cd "$RELEASE_ASSETS_DIR"
              sha256sum -c "$(basename "$checksum")"
            )
          done < <(find "$RELEASE_ASSETS_DIR" -maxdepth 1 -type f -name '*.sha256' | LC_ALL=C sort)

      - name: Prepare draft release
        shell: bash
        run: |
          set -euo pipefail

          find_release() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -s --arg tag "$RELEASE_TAG" '
                  add
                  | map(select(.tag_name == $tag))
                  | if length > 1 then error("multiple releases found for tag " + $tag)
                    elif length == 1 then .[0]
                    else empty
                    end
                '
          }

          remote_tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
          if [[ "$remote_tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Remote tag $RELEASE_TAG resolves to $remote_tag_sha, expected $RELEASE_SHA" >&2
            exit 1
          fi

          release_json=$(find_release)
          if [[ -n "$release_json" ]]; then
            if [[ "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
              echo "Release $RELEASE_TAG is already public; refusing to overwrite it" >&2
              exit 1
            fi
            echo "Resuming existing draft release $RELEASE_TAG"
          else
            create_args=(
              release create "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --target "$RELEASE_SHA"
              --title "AgentKib $RELEASE_TAG"
              --generate-notes
              --verify-tag
              --draft
            )
            if [[ "$APP_VERSION" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            gh "${create_args[@]}"
            release_json=$(find_release)
          fi

          release_id=$(jq -r '.id // empty' <<<"$release_json")
          if ! [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Unable to resolve draft release ID for $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RELEASE_ASSETS_DIR"/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify uploaded release assets
        shell: bash
        run: |
          set -euo pipefail
          local_manifest="$RUNNER_TEMP/local-release-assets.txt"
          remote_manifest="$RUNNER_TEMP/remote-release-assets.txt"

          for artifact in "$RELEASE_ASSETS_DIR"/*; do
            printf '%s\t%s\n' "$(basename "$artifact")" "$(stat -c '%s' "$artifact")"
          done | LC_ALL=C sort > "$local_manifest"

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | [.name, .size] | @tsv' \
            | LC_ALL=C sort > "$remote_manifest"

          if ! diff -u "$local_manifest" "$remote_manifest"; then
            echo "Uploaded release assets do not match local artifacts" >&2
            exit 1
          fi

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APP_VERSION" == *-* ]]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease
          else
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --latest
          fi

          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          if [[ "$(jq -r '.draft' <<<"$release_json")" != false ]]; then
            echo "Release $RELEASE_TAG remained a draft after publication" >&2
            exit 1
          fi

          expected_prerelease=false
          if [[ "$APP_VERSION" == *-* ]]; then
            expected_prerelease=true
          fi
          if [[ "$(jq -r '.prerelease' <<<"$release_json")" != "$expected_prerelease" ]]; then
            echo "Release $RELEASE_TAG has an unexpected prerelease state" >&2
            exit 1
          fi

          echo "Published $(jq -r '.html_url' <<<"$release_json")"
