name: Desktop Package Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and publish; leave empty for artifact-only builds"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate and test selected revision
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-preflight-ubuntu22-x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate desktop versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/package.json')).version")
          cargo_version=$(cargo metadata --no-deps --format-version 1 | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const runtime = JSON.parse(input).packages.find(({ name }) => name === "agentkib-runtime");
              if (!runtime) process.exit(1);
              console.log(runtime.version);
            });
          ')

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid desktop version: $package_version" >&2
            exit 1
          fi
          if [[ "$package_version" != "$cargo_version" ]]; then
            echo "Desktop versions differ: package=$package_version cargo=$cargo_version" >&2
            exit 1
          fi

          echo "Validated AgentKib desktop version $package_version"
          echo "app_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Validate release ref
        id: release
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          REQUESTED_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          release_tag="$PUSHED_TAG"
          if [[ -n "$REQUESTED_TAG" ]]; then
            if [[ -n "$release_tag" && "$release_tag" != "$REQUESTED_TAG" ]]; then
              echo "Selected ref tag $release_tag does not match requested tag $REQUESTED_TAG" >&2
              exit 1
            fi
            release_tag="$REQUESTED_TAG"
          fi

          release_sha=$(git rev-parse 'HEAD^{commit}')
          should_publish=false

          if [[ -n "$release_tag" ]]; then
            expected_tag="v$APP_VERSION"
            if [[ "$release_tag" != "$expected_tag" ]]; then
              echo "Release tag $release_tag does not match desktop version $APP_VERSION; expected $expected_tag" >&2
              exit 1
            fi

            tag_sha=$(git rev-list -n 1 "$release_tag")
            if [[ "$tag_sha" != "$release_sha" ]]; then
              echo "Release tag $release_tag resolves to $tag_sha, but checkout resolved to $release_sha" >&2
              exit 1
            fi

            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if ! git merge-base --is-ancestor "$release_sha" origin/main; then
              echo "Release commit $release_sha is not contained in origin/main" >&2
              exit 1
            fi

            should_publish=true
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "Selected release revision: sha=$release_sha tag=${release_tag:-none} publish=$should_publish"

      - name: Validate release signing secrets
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY != '' }}
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          required=(
            HAS_APPLE_API_ISSUER
            HAS_APPLE_API_KEY
            HAS_APPLE_API_PRIVATE_KEY
            HAS_APPLE_CERTIFICATE
            HAS_APPLE_CERTIFICATE_PASSWORD
            HAS_APPLE_SIGNING_IDENTITY
            HAS_APPLE_TEAM_ID
          )
          for name in "${required[@]}"; do
            if [[ "${!name}" != true ]]; then
              echo "Required release secret is missing: ${name#HAS_}" >&2
              exit 1
            fi
          done

      - name: Test release scripts
        run: node --test .github/scripts/*.test.mjs

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test frontend
        run: pnpm test

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

  desktop:
    name: Build ${{ matrix.name }} ${{ matrix.arch }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            arch: arm64
            updater_channel: arm64
            os: macos-15
            artifact: macos-arm64
          - name: macOS
            arch: x64
            updater_channel: x64
            os: macos-15-intel
            artifact: macos-x64
          - name: Windows
            arch: x64
            updater_channel: x64
            os: windows-2025
            artifact: windows-x64
          - name: Windows
            arch: arm64-preview
            updater_channel: arm64
            os: windows-11-arm
            artifact: windows-arm64-preview
          - name: Ubuntu
            arch: x64
            os: ubuntu-22.04
            artifact: linux-ubuntu-x64
          - name: Ubuntu
            arch: arm64-preview
            os: ubuntu-24.04-arm
            artifact: linux-ubuntu-arm64-preview

    env:
      APP_VERSION: ${{ needs.preflight.outputs.app_version }}
      CARGO_TERM_COLOR: always
      DESKTOP_RELEASE_DIR: dist/desktop-release
      SHOULD_PUBLISH: ${{ needs.preflight.outputs.should_publish }}

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - name: Checkout Windows release helper scripts
        if: runner.os == 'Windows'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-helpers
          sparse-checkout: .github/scripts

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources || true
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils curl file pkg-config patchelf libssl-dev \
            libgtk-3-dev libfuse2 libglib2.0-bin desktop-file-utils \
            xdg-utils dbus-x11 xvfb

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust and quota collector
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.artifact }}
          cache-directories: ~/.cache/agentkib/codexbar/0.49.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean previous Electron bundle outputs
        shell: bash
        run: |
          rm -rf apps/desktop/release-electron apps/desktop/build/quota

      - name: Prepare Apple notarization private key
        if: runner.os == 'macOS' && env.SHOULD_PUBLISH == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          test -s "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build Electron bundles
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          cd apps/desktop
          pnpm protocol:generate
          pnpm runtime:build
          pnpm quota:prepare
          pnpm runtime:stage
          pnpm build:web
          pnpm electron:build

          args=(--publish never)
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=(--mac dmg zip)
            if [[ "$SHOULD_PUBLISH" == true ]]; then
              export CSC_LINK="$APPLE_CERTIFICATE"
              export CSC_KEY_PASSWORD="$APPLE_CERTIFICATE_PASSWORD"
              export CSC_NAME="${APPLE_SIGNING_IDENTITY#Developer ID Application: }"
              export APPLE_API_KEY="$APPLE_API_KEY_PATH"
              args+=(--config.mac.notarize=true)
            fi
          elif [[ "$RUNNER_OS" == Windows ]]; then
            args+=(--win nsis)
            if [[ "${{ matrix.arch }}" == arm64-preview ]]; then
              args+=(--arm64)
            else
              args+=(--x64)
            fi
          else
            args+=(--linux deb AppImage)
          fi

          pnpm exec electron-builder "${args[@]}"

      - name: Smoke test Linux bundles
        if: runner.os == 'Linux'
        run: .github/scripts/smoke-test-linux-package.sh apps/desktop/release-electron

      - name: Smoke test installed Ubuntu package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package=$(find "$PWD/apps/desktop/release-electron" -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          sudo apt-get install -y "$package"
          .github/scripts/smoke-test-linux-installed.sh

      - name: Smoke test Windows x64 installer
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        run: ./.release-helpers/.github/scripts/smoke-test-windows-installer.ps1 -SearchRoot apps/desktop/release-electron

      - name: Smoke test Windows ARM64 preview installer
        if: runner.os == 'Windows' && matrix.arch == 'arm64-preview'
        shell: pwsh
        run: ./.release-helpers/.github/scripts/smoke-test-windows-installer.ps1 -SearchRoot apps/desktop/release-electron -SkipQuota

      - name: Upload Windows installer diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: agentkib-installer-diagnostics-${{ matrix.artifact }}
          path: artifacts/windows-installer-diagnostics/summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify macOS application bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find apps/desktop/release-electron -type d -name '*.app' -print -quit)
          test -n "$app"
          executable=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -u+x -print -quit)
          test -n "$executable"
          test -s apps/desktop/release-electron/AgentKib_${APP_VERSION}_macos-${{ matrix.arch }}.dmg
          test -s apps/desktop/release-electron/AgentKib_${APP_VERSION}_macos-${{ matrix.arch }}.zip
          echo "Verified macOS application executable: $executable"

      - name: Verify signed and notarized macOS release
        if: runner.os == 'macOS' && env.SHOULD_PUBLISH == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app=$(find apps/desktop/release-electron -type d -name '*.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          signing_details=$(codesign --display --verbose=4 "$app" 2>&1)
          grep -F "Authority=$APPLE_SIGNING_IDENTITY" <<< "$signing_details"
          grep -F "TeamIdentifier=${APPLE_TEAM_ID}" <<< "$signing_details"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Remove Apple notarization private key
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DESKTOP_RELEASE_DIR"
          mkdir -p "$DESKTOP_RELEASE_DIR"
          electron_dir="apps/desktop/release-electron"
          test -d "$electron_dir"

          case "$RUNNER_OS" in
            macOS)
              for artifact in "$electron_dir"/*.dmg "$electron_dir"/*.zip "$electron_dir"/*.blockmap; do
                [[ -f "$artifact" ]] && cp "$artifact" "$DESKTOP_RELEASE_DIR/"
              done
              metadata="$electron_dir/latest-mac.yml"
              test -s "$metadata"
              cp "$metadata" "$DESKTOP_RELEASE_DIR/${{ matrix.updater_channel }}-mac.yml"
              ;;
            Windows)
              for artifact in "$electron_dir"/*.exe "$electron_dir"/*.blockmap; do
                [[ -f "$artifact" ]] && cp "$artifact" "$DESKTOP_RELEASE_DIR/"
              done
              metadata="$electron_dir/latest.yml"
              test -s "$metadata"
              cp "$metadata" "$DESKTOP_RELEASE_DIR/${{ matrix.updater_channel }}.yml"
              ;;
            Linux)
              for artifact in "$electron_dir"/*.deb "$electron_dir"/*.AppImage "$electron_dir"/*.blockmap; do
                [[ -f "$artifact" ]] && cp "$artifact" "$DESKTOP_RELEASE_DIR/"
              done
              if [[ "${{ matrix.arch }}" == x64 ]]; then
                metadata="$electron_dir/latest-linux.yml"
                destination="latest-linux.yml"
              else
                metadata="$electron_dir/latest-linux-arm64.yml"
                destination="latest-linux-arm64.yml"
              fi
              test -s "$metadata"
              cp "$metadata" "$DESKTOP_RELEASE_DIR/$destination"
              ;;
          esac

          count=$(find "$DESKTOP_RELEASE_DIR" -type f | wc -l | tr -d ' ')
          test "$count" -gt 0
          find "$DESKTOP_RELEASE_DIR" -type f -print

      - name: Write release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$DESKTOP_RELEASE_DIR"
          for artifact in *; do
            case "$artifact" in
              *.dmg|*.zip|*.exe|*.deb|*.rpm|*.AppImage|*.blockmap) ;;
              *) continue ;;
            esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$artifact" > "$artifact.sha256"
            else
              shasum -a 256 "$artifact" > "$artifact.sha256"
            fi
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agentkib-desktop-${{ matrix.artifact }}
          path: ${{ env.DESKTOP_RELEASE_DIR }}/*
          if-no-files-found: error

  fedora-x64:
    name: Build Fedora x64 RPM
    needs: preflight
    runs-on: ubuntu-24.04
    container: fedora:42
    env:
      APP_VERSION: ${{ needs.preflight.outputs.app_version }}
      CARGO_TERM_COLOR: always
      DESKTOP_RELEASE_DIR: dist/desktop-release

    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf install -y \
            git curl tar gzip xz file findutils which binutils \
            gcc gcc-c++ make libatomic openssl-devel pkgconf-pkg-config patchelf \
            gtk3-devel libxcrypt-compat rpm-build rpmdevtools cpio \
            desktop-file-utils xdg-utils dbus-daemon xorg-x11-server-Xvfb util-linux

      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).packageManager.replace(/^pnpm@/, '')")
          npm install --global "pnpm@$pnpm_version"
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust and quota collector
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-fedora-x64
          cache-directories: ~/.cache/agentkib/codexbar/0.49.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean previous Electron bundle outputs
        shell: bash
        run: rm -rf apps/desktop/release-electron apps/desktop/build/quota

      - name: Build Electron RPM
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          pnpm protocol:generate
          pnpm runtime:build
          pnpm quota:prepare
          pnpm runtime:stage
          pnpm build:web
          pnpm electron:build
          pnpm exec electron-builder --linux rpm --publish never

      - name: Smoke test RPM
        run: .github/scripts/smoke-test-linux-package.sh apps/desktop/release-electron rpm

      - name: Smoke test installed RPM
        shell: bash
        run: |
          set -euo pipefail
          package=$(find "$PWD/apps/desktop/release-electron" -maxdepth 1 -type f -name '*.rpm' -print -quit)
          test -n "$package"
          dnf install -y "$package"
          .github/scripts/smoke-test-linux-installed.sh

      - name: Stage release artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DESKTOP_RELEASE_DIR"
          mkdir -p "$DESKTOP_RELEASE_DIR"
          source=$(find apps/desktop/release-electron -maxdepth 1 -type f -name '*.rpm' -print -quit)
          test -n "$source"
          cp "$source" "$DESKTOP_RELEASE_DIR/"
          destination="$DESKTOP_RELEASE_DIR/$(basename "$source")"
          (
            cd "$DESKTOP_RELEASE_DIR"
            artifact=$(basename "$destination")
            sha256sum "$artifact" > "$artifact.sha256"
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentkib-desktop-linux-fedora-x64
          path: ${{ env.DESKTOP_RELEASE_DIR }}/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - preflight
      - desktop
      - fedora-x64
    if: needs.preflight.outputs.should_publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.preflight.outputs.app_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ASSETS_DIR: dist/github-release
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_WORKFLOW_SCRIPTS_DIR: .release-workflow-source/.github/scripts
      WORKFLOW_ARTIFACTS_DIR: dist/workflow-artifacts

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 1

      - name: Checkout release workflow helpers
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-workflow-source
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Test release workflow helpers
        shell: bash
        run: node --test "$RELEASE_WORKFLOW_SCRIPTS_DIR"/*.test.mjs

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: agentkib-desktop-*
          path: ${{ env.WORKFLOW_ARTIFACTS_DIR }}

      - name: Validate release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          prefix="AgentKib_${APP_VERSION}"
          mkdir -p "$RELEASE_ASSETS_DIR"

          while IFS= read -r -d '' source; do
            destination="$RELEASE_ASSETS_DIR/$(basename "$source")"
            if [[ -e "$destination" ]]; then
              echo "Duplicate release artifact name: $(basename "$source")" >&2
              exit 1
            fi
            cp "$source" "$destination"
          done < <(find "$WORKFLOW_ARTIFACTS_DIR" -type f -print0)

          cat > "$RUNNER_TEMP/required-release-assets.txt" <<EOF
          ${prefix}_linux-arm64.AppImage
          ${prefix}_linux-arm64.AppImage.sha256
          ${prefix}_linux-arm64.deb
          ${prefix}_linux-arm64.deb.sha256
          ${prefix}_linux-x86_64.AppImage
          ${prefix}_linux-x86_64.AppImage.sha256
          ${prefix}_linux-amd64.deb
          ${prefix}_linux-amd64.deb.sha256
          ${prefix}_linux-x86_64.rpm
          ${prefix}_linux-x86_64.rpm.sha256
          ${prefix}_macos-arm64.dmg
          ${prefix}_macos-arm64.dmg.sha256
          ${prefix}_macos-arm64.zip
          ${prefix}_macos-arm64.zip.sha256
          ${prefix}_macos-x64.dmg
          ${prefix}_macos-x64.dmg.sha256
          ${prefix}_macos-x64.zip
          ${prefix}_macos-x64.zip.sha256
          ${prefix}_windows-arm64.exe
          ${prefix}_windows-arm64.exe.sha256
          ${prefix}_windows-x64.exe
          ${prefix}_windows-x64.exe.sha256
          latest-linux-arm64.yml
          latest-linux.yml
          arm64-mac.yml
          x64-mac.yml
          arm64.yml
          x64.yml
          EOF

          find "$RELEASE_ASSETS_DIR" -maxdepth 1 -type f -exec basename {} \; \
            | LC_ALL=C sort > "$RUNNER_TEMP/actual-release-assets.txt"

          missing_required_asset=false
          while IFS= read -r required; do
            if [[ ! -s "$RELEASE_ASSETS_DIR/$required" ]]; then
              echo "Missing required release artifact: $required" >&2
              missing_required_asset=true
            fi
          done < "$RUNNER_TEMP/required-release-assets.txt"
          [[ "$missing_required_asset" == false ]]

          while IFS= read -r actual; do
            case "$actual" in
              *.blockmap|*.blockmap.sha256) ;;
              *) grep -Fx "$actual" "$RUNNER_TEMP/required-release-assets.txt" >/dev/null || {
                echo "Unexpected release artifact: $actual" >&2
                exit 1
              } ;;
            esac
          done < "$RUNNER_TEMP/actual-release-assets.txt"

          while IFS= read -r artifact; do
            test -s "$artifact"
          done < <(find "$RELEASE_ASSETS_DIR" -maxdepth 1 -type f | LC_ALL=C sort)

          while IFS= read -r checksum; do
            (
              cd "$RELEASE_ASSETS_DIR"
              sha256sum -c "$(basename "$checksum")"
            )
          done < <(find "$RELEASE_ASSETS_DIR" -maxdepth 1 -type f -name '*.sha256' | LC_ALL=C sort)

      - name: Validate Electron updater metadata
        shell: bash
        run: |
          set -euo pipefail
          for metadata in latest-linux.yml latest-linux-arm64.yml arm64-mac.yml x64-mac.yml arm64.yml x64.yml; do
            file="$RELEASE_ASSETS_DIR/$metadata"
            test -s "$file"
            grep -Eq "^version: ${APP_VERSION//./\\.}$" "$file"
            grep -q '^files:' "$file"
            grep -q 'sha512:' "$file"
          done

      - name: Prepare draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          remote_tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
          if [[ "$remote_tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Remote tag $RELEASE_TAG resolves to $remote_tag_sha, expected $RELEASE_SHA" >&2
            exit 1
          fi

          release_json=$(node "$RELEASE_WORKFLOW_SCRIPTS_DIR/resolve-draft-release.mjs")
          if [[ -n "$release_json" ]]; then
            echo "Resuming existing draft release $RELEASE_TAG"
          else
            create_args=(
              release create "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --target "$RELEASE_SHA"
              --title "AgentKib $RELEASE_TAG"
              --generate-notes
              --verify-tag
              --draft
            )
            if [[ "$APP_VERSION" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            gh "${create_args[@]}"
            release_json=$(node "$RELEASE_WORKFLOW_SCRIPTS_DIR/resolve-draft-release.mjs" --wait)
          fi

          release_id=$(jq -r '.id // empty' <<<"$release_json")
          if ! [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Unable to resolve draft release ID for $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RELEASE_ASSETS_DIR"/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify uploaded release assets
        shell: bash
        run: |
          set -euo pipefail
          local_manifest="$RUNNER_TEMP/local-release-assets.txt"
          remote_manifest="$RUNNER_TEMP/remote-release-assets.txt"

          for artifact in "$RELEASE_ASSETS_DIR"/*; do
            printf '%s\t%s\n' "$(basename "$artifact")" "$(stat -c '%s' "$artifact")"
          done | LC_ALL=C sort > "$local_manifest"

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | [.name, .size] | @tsv' \
            | LC_ALL=C sort > "$remote_manifest"

          if ! diff -u "$local_manifest" "$remote_manifest"; then
            echo "Uploaded release assets do not match local artifacts" >&2
            exit 1
          fi

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APP_VERSION" == *-* ]]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease
          else
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --latest
          fi

          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          if [[ "$(jq -r '.draft' <<<"$release_json")" != false ]]; then
            echo "Release $RELEASE_TAG remained a draft after publication" >&2
            exit 1
          fi

          expected_prerelease=false
          if [[ "$APP_VERSION" == *-* ]]; then
            expected_prerelease=true
          fi
          if [[ "$(jq -r '.prerelease' <<<"$release_json")" != "$expected_prerelease" ]]; then
            echo "Release $RELEASE_TAG has an unexpected prerelease state" >&2
            exit 1
          fi

          echo "Published $(jq -r '.html_url' <<<"$release_json")"
