name: Windows Store Package

on:
  pull_request:
    paths:
      - ".github/workflows/windows-store.yml"
      - ".github/workflows/release-desktop.yml"
      - ".github/scripts/*windows-store*"
      - "apps/desktop/electron-builder.yml"
      - "apps/desktop/electron/main/app-updates.ts"
      - "apps/desktop/resources/windows-store/**"
      - "apps/desktop/scripts/package-windows-store.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-store-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msix:
    name: Windows x64 installed MSIX smoke
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      AGENTKIB_PACKAGE_ARCH: x64
      AGENTKIB_QUOTA_TARGET: x86_64-pc-windows-msvc
      WINDOWS_STORE_IDENTITY_NAME: AgentKib.StoreSmoke
      WINDOWS_STORE_PUBLISHER: CN=AgentKib Store Smoke
      WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: AgentKib MSIX Test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Trace package context in the diagnostic package
        shell: pwsh
        run: |
          node --input-type=module -e @'
          import { readFileSync, writeFileSync } from "node:fs";
          function insert(file, marker, code) {
            const source = readFileSync(file, "utf8");
            if (!source.includes(marker)) throw new Error("Missing diagnostic marker.");
            writeFileSync(file, source.replace(marker, code + "\n" + marker));
          }
          const trace = 'const trace = (status: unknown) => require("node:fs").appendFileSync(require("node:path").join(process.env.LOCALAPPDATA, "ai.agentkib", "msix-runtime-smoke.log"), String(status) + "\\n");';
          insert("apps/desktop/electron/main/local-runtime-transport.ts", "if (process.windowsStore === true && !config.spawnProcess)", trace + 'trace("Desktop windowsStore=" + process.windowsStore);');
          insert("packages/backend/src/windows-store-process.ts", "const { hThread, hProcess } = api.processHandles(information);", trace + 'trace("CreateProcessW succeeded");');
          insert("packages/backend/src/windows-store-process.ts", "api.close(hThread);", 'const pkgLength = Buffer.alloc(4); const packageInfo = nativeBindings().load("kernel32.dll").func("__stdcall", "GetPackageFullName", "int", ["void *", "void *", "void *"]); trace("Child package status: " + packageInfo(hProcess, pkgLength, null));');
          const host = "apps/desktop/electron/main/local-runtime-transport.ts";
          const launch = "launchPackagedWindowsProcess(config.electronPath, args, environment);";
          writeFileSync(host, readFileSync(host, "utf8").replace(launch, "try { " + launch + " } catch (error) { trace(error); throw error; }"));
          const backend = "apps/desktop/electron/backend-entry.ts";
          insert(backend, 'if (error instanceof Error && error.message === "session-managed-by-another-runtime") return;', trace + "trace(error instanceof Error ? error.message : error);");
          '@

      - name: Build Electron bundles
        working-directory: apps/desktop
        run: pnpm build:electron

      - name: Build two versions of the same test package
        shell: pwsh
        run: |
          node apps/desktop/scripts/package-windows-store.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $package = Get-ChildItem apps/desktop/release-windows-store -Filter '*.msix' -File
          if (@($package).Count -ne 1) { throw "Expected one base MSIX" }
          Move-Item -LiteralPath $package.FullName -Destination "$env:RUNNER_TEMP/agentkib-store-base.msix"

          node --input-type=module -e @'
          import { readFileSync, writeFileSync } from "node:fs";
          const file = "apps/desktop/package.json";
          const metadata = JSON.parse(readFileSync(file, "utf8"));
          const [major, minor, patch] = metadata.version.split("-")[0].split(".").map(Number);
          metadata.version = [major, minor, patch + 1].join(".");
          writeFileSync(file, JSON.stringify(metadata, null, 2) + "\n");
          '@
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node apps/desktop/scripts/package-windows-store.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $package = Get-ChildItem apps/desktop/release-windows-store -Filter '*.msix' -File
          if (@($package).Count -ne 1) { throw "Expected one upgrade MSIX" }
          Move-Item -LiteralPath $package.FullName -Destination "$env:RUNNER_TEMP/agentkib-store-upgrade.msix"

      - name: Install, upgrade and uninstall the test package
        shell: pwsh
        run: ./.github/scripts/smoke-test-windows-store.ps1 -Package "$env:RUNNER_TEMP/agentkib-store-base.msix" -UpgradePackage "$env:RUNNER_TEMP/agentkib-store-upgrade.msix"
