name: Windows TypeScript Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-arm64:
    name: Typecheck on Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          architecture: arm64
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build backend and stage native bindings
        run: pnpm --filter @agentkib/desktop backend:build
      - name: Test backend workers, native bindings and MCP ownership
        # Each fixture starts real backend Workers; cap parallelism without serializing the suite.
        # Allow Windows integration startup time; explicit deadlines and latency assertions remain.
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: pnpm test:backend:stability --maxWorkers=2 --testTimeout=15000

  typecheck:
    name: Typecheck on Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build backend and stage native bindings
        run: pnpm --filter @agentkib/desktop backend:build
      - name: Test backend workers, native bindings and MCP ownership
        # Cap parallelism while allowing independent test files to run together.
        # Allow Windows integration startup time; explicit deadlines and latency assertions remain.
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: pnpm test:backend:stability --maxWorkers=2 --testTimeout=15000
