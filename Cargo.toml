[workspace]
resolver = "2"
members = [
  "crates/agentkib-protocol",
  "crates/agentkib-runtime",
  "crates/agentkib-platform",
  "crates/agentkib-core",
  "crates/agentkib-adapters",
  "crates/agentkib-discovery",
  "crates/agentkib-conversations",
  "crates/agentkib-git",
  "crates/agentkib-insights",
  "crates/agentkib-quota",
  "crates/agentkib-storage",
  "crates/agentkib-store",
  "crates/agentkib-cli",
  "crates/agentkib-mcp",
  "crates/agentkib-skills",
  "crates/agentkib-gateways",
  "crates/agentkib-tools",
  "crates/agentkib-remote",
  "crates/agentkib-codex-bridge",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
agentkib-codex-bridge = { path = "crates/agentkib-codex-bridge" }
agentkib-protocol = { path = "crates/agentkib-protocol" }
agentkib-platform = { path = "crates/agentkib-platform" }
agentkib-core = { path = "crates/agentkib-core" }
agentkib-adapters = { path = "crates/agentkib-adapters" }
agentkib-discovery = { path = "crates/agentkib-discovery" }
agentkib-conversations = { path = "crates/agentkib-conversations" }
agentkib-git = { path = "crates/agentkib-git" }
agentkib-insights = { path = "crates/agentkib-insights" }
agentkib-quota = { path = "crates/agentkib-quota" }
agentkib-storage = { path = "crates/agentkib-storage" }
agentkib-mcp = { path = "crates/agentkib-mcp" }
agentkib-skills = { path = "crates/agentkib-skills" }
agentkib-gateways = { path = "crates/agentkib-gateways" }
agentkib-tools = { path = "crates/agentkib-tools" }
agentkib-remote = { path = "crates/agentkib-remote" }
agentkib-store = { path = "crates/agentkib-store" }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
futures-util = "0.3"
hex = "0.4"
http = "1.3"
json5 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rmcp = { version = "3.1.2", features = ["auth", "client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
semver = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
toml = "0.9"
uuid = { version = "1.17", features = ["v4", "serde"] }
walkdir = "2.5"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
