overrides:
  '@modelcontextprotocol/sdk@>=1.12.0 <1.32.1': 1.32.1
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'qs@>=2.2.5 <6.16.0': 6.16.0
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'hono@<4.13.13': 4.13.13
  '@hono/node-server@>=2.0.0 <2.1.6': 2.1.6
  'systeminformation@>=5.0.0 <5.33.19': 5.33.19
  'ip-address@>=10.0.0 <10.7.1': 10.7.1
  'proxy-addr@>=1.1.0 <2.0.8': 2.0.8
  'undici@>=6.0.0 <6.28.1': 6.28.1
  'undici@>=7.0.0 <7.29.1': 7.29.1
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'http-cache-semantics@>=4.0.0 <4.3.0': 4.3.0
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'follow-redirects@>=1.0.0 <1.16.1': 1.16.1
  'tinypool@>=2.0.0 <2.1.2': 2.1.2

allowBuilds:
  electron-winstaller: true
  koffi: true

minimumReleaseAgeExclude:
  - vite@8.3.4
